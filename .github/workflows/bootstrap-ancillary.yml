name: bootstrap-ancillary

# Stages a region-month of CAMEL emissivity into the private R2 ancillary
# prefix. It is the only job that holds Earthdata credentials, so the
# operational path never touches them.
#
# A month needs staging once, but it needs it *before* the first scan of that
# month arrives: the processor looks up the scan's own month and fails hard on
# a missing key, so an unstaged rollover breaks every region at 00:00 on the
# first. The schedule below stages the upcoming month with days to spare, and
# the dispatch inputs remain for restaging a bad subset or filling a gap.
#
# A scheduled run stages the current month and the next one, for every
# region. Staging is idempotent (an existing key is overwritten with the same
# subset), so the two runs a month back each other up: if Earthdata is down
# on the 25th, the 1st restages the month that just started and the backfill
# window covers the scans that failed meanwhile; if a region was added after
# the 25th, the 1st stages its first month too.

# Retired (2026-10-10): the viewer's own pipeline stages the same months into
# the same prefix on its own schedule now. The dispatch stays for a manual
# restage.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region key, or blank for all of them"
        required: false
        default: ""
      month:
        description: "YYYY-MM to stage (blank = the current month)"
        required: false
        default: ""

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: earthdata
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Write the Earthdata netrc
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          umask 077
          printf 'machine urs.earthdata.nasa.gov login %s password %s\n' \
            "$EARTHDATA_USERNAME" "$EARTHDATA_PASSWORD" > "$HOME/.netrc"

      - name: Stage CAMEL
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          ONLY: ${{ inputs.region }}
          MONTH: ${{ inputs.month }}
        run: |
          # The scheduled run stages this month and the next; a dispatch
          # with a blank month keeps meaning "the current one".
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            MONTHS=$(python3 -c 'import datetime as dt; today = dt.datetime.now(dt.UTC).date(); print(f"{today:%Y-%m} {today.replace(day=28) + dt.timedelta(days=7):%Y-%m}")')
            echo "scheduled run: staging $MONTHS"
          else
            MONTHS="$MONTH"
          fi
          keys=$(python3 -c "import tomllib;print(' '.join(sorted(tomllib.load(open('regions.toml','rb')))))")
          if [ -n "$ONLY" ]; then keys="$ONLY"; fi
          for key in $keys; do
            if [ -n "$MONTHS" ]; then
              for month in $MONTHS; do
                uv run shachen-ops bootstrap-camel --region "$key" --month "$month"
              done
            else
              uv run shachen-ops bootstrap-camel --region "$key"
            fi
          done

      - name: Remove the netrc
        if: always()
        run: rm -f "$HOME/.netrc"
