[project]
name = "shachen-ops"
version = "0.1.0"
description = "Operational DEBRA-Dust pipeline: live GOES ABI / Himawari AHI scans to Cloudflare R2"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Han Xiao", email = "ringsaturn.me@gmail.com" }]

dependencies = [
    "shachen[satellite,data,render]==0.3.0",
    "boto3>=1.40.0",
    "cfgrib>=0.9.15",
    "eccodes>=2.44.0",
    "pyproj>=3.7.0",
    "eccodeslib>=2.48.0 ; sys_platform != 'win32'",
]

[project.scripts]
shachen-ops = "shachen_ops.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
